<title>Poly3D Cristallochimie</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#16212e;--muted:#5b6878;--rule:#d3dae2;--accent:#0b5c8c}
@media (prefers-color-scheme: dark){:root{--bg:#10161d;--surface:#18212b;--ink:#e6ecf2;--muted:#93a1b1;--rule:#2b3745;--accent:#5fb4e6;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:32px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
p{color:var(--muted);margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
a{display:block;padding:14px 16px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;color:var(--ink);text-decoration:none}
a:hover,a:focus-visible{border-color:var(--accent)}
a small{display:block;color:var(--muted)}
</style>
</head>
